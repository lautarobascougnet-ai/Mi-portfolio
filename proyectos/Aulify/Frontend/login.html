<!doctype html>
<html lang="es" class="text-[100%] lg:text-[81.25%]">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="aulify-icon.svg" />
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="js/api.js?v=20261014"></script>
		<title>Iniciar sesión | Aulify</title>
			<!-- Configuración de la app instalable. -->
		<link rel="manifest" href="../porteo/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="../porteo/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#626780" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Aulify" />
		<script src="../porteo/js/pwa.js" defer></script>
	</head>
	<body class="text-[calc(1rem+2px)] [overflow-wrap:anywhere] [&_input]:min-w-0 [&_input]:max-w-full [&_select]:max-w-full min-h-screen bg-[#626780] text-[#12192f] antialiased flex min-h-screen flex-col !pb-0 [&[hidden]]:!hidden [&>main]:w-full [&>header]:w-full">
		<main class="flex min-h-screen items-center justify-center px-6 py-12">
			<section class="w-full max-w-md">
				<a
					href="Index.html"
					class="mb-10 flex items-center justify-center gap-3 text-[calc(1.125rem+2px)] font-semibold tracking-tight"
					><img
						src="aulify-icon.svg"
						alt="Logo de Aulify"
						class="h-9 w-9 rounded-full object-cover"
					/><span class="font-[Georgia] text-[calc(1.5rem+2px)] font-normal uppercase tracking-[-0.05em] !text-[#eef0f2]">Aulify</span></a
				>
				<div
					class="rounded-2xl border border-[#bacbd8] bg-[#dce9f3] p-7 shadow-[0_18px_45px_rgba(23,33,43,0.08)] sm:p-9 text-[#171c24]      [&_h2]:text-[#171c24] [&_h3]:text-[#171c24] [&_p]:text-[#52616b] [&_span]:text-[#171c24] [&_a]:text-[#06165e]"
				>
					<p
						class="text-[calc(.75rem+2px)] font-semibold uppercase tracking-[0.16em] text-[#159ac5]"
					>
						Bienvenido de nuevo
					</p>
					<h1 class="mt-2 text-[calc(1.875rem+2px)] font-semibold tracking-tight">
						Iniciar sesión
					</h1>
					<p class="mt-3 text-[calc(.875rem+2px)] leading-6 text-[#68747a]">
						Accede a tu cuenta para encontrar tu próximo profesor.
					</p>
					<p
						id="feedback"
						class="hidden mt-5 rounded-lg border px-4 py-3 text-[calc(.875rem+2px)]"
					></p>
					<form id="login-form" class="mt-7 space-y-5">
						<label class="block text-[calc(.875rem+2px)] font-medium"
							>Email o usuario<input
								name="email"
								type="text"
								required
								autocomplete="username"
								autocapitalize="none"
								spellcheck="false"
								class="mt-2 w-full rounded-lg border border-[#bacbd8] bg-[#dce9f3] px-4 py-3 outline-none focus:border-[#159ac5] focus:ring-2 focus:ring-[#b9e6f6] text-[#171c24]      [&_h2]:text-[#171c24] [&_h3]:text-[#171c24] [&_p]:text-[#52616b] [&_span]:text-[#171c24] [&_a]:text-[#06165e]"
						/></label>
						<label class="block text-[calc(.875rem+2px)] font-medium"
							>Contraseña<input
								name="password"
								type="password"
								required
								autocomplete="current-password"
								class="mt-2 w-full rounded-lg border border-[#bacbd8] bg-[#dce9f3] px-4 py-3 outline-none focus:border-[#159ac5] focus:ring-2 focus:ring-[#b9e6f6] text-[#171c24]      [&_h2]:text-[#171c24] [&_h3]:text-[#171c24] [&_p]:text-[#52616b] [&_span]:text-[#171c24] [&_a]:text-[#06165e]"
						/></label>
						<button
							id="submit-button"
							type="submit"
							class="w-full rounded-lg bg-[#17212b] px-4 py-3 font-medium text-white transition hover:bg-[#159ac5]"
						>
							Entrar a Aulify
						</button>
					</form>
					<p class="mt-6 text-center text-[calc(.875rem+2px)] text-[#68747a]">
						¿Todavía no tienes cuenta?
						<a
							href="registro.html"
							class="font-semibold text-[#159ac5] hover:underline"
							>Regístrate</a
						>
					</p>
				</div>
			</section>
		</main>
		<script src="js/login.js?v=20261014"></script>
		<!-- Pie de página al final del contenido, sin superponerse a la pantalla. -->
<footer class="!static mt-auto w-full shrink-0 !block !h-auto !p-0 bg-gradient-to-b from-[#626780] via-[#484d63] to-[#171923] text-[#bfc0ca] [&>div>div>p]:!m-0 [&>div>div>p]:!text-[calc(0.6875rem+2px)] [&>div>div>p]:!leading-snug">
			<div class="mx-auto flex min-h-52 max-w-7xl flex-col justify-between gap-6 px-6 py-6 sm:min-h-44">
				<div class="flex flex-wrap items-center justify-between gap-3">
					<a href="Index.html" class="flex items-center gap-2 text-white [@media(max-height:600px)]:hidden"><img src="aulify-icon.svg" alt="" class="h-8 w-8" /><span class="font-[Georgia] text-[calc(1.5rem+2px)] uppercase">Aulify</span></a>
					<nav aria-label="Enlaces del pie de página" class="flex flex-wrap gap-4 text-[calc(.75rem+2px)]"><a href="Index.html" class="hover:underline">Inicio</a><a href="login.html" class="hover:underline">Mis clases</a></nav>
				</div>
				<div class="flex flex-col gap-2 text-[calc(0.6875rem+2px)] leading-snug">
					<p>© 2026 Aulify. Todos los derechos reservados.</p>
					<p>Si tiene algún problema con la página, escriba a <a href="mailto:aulify@soporte.com" class="underline">aulify@soporte.com</a>.</p>
				</div>
			</div>
		</footer>
	</body>
</html>
